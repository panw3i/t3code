# Fork 的 CI：只覆盖 server + web。上游 CI 已由 scripts/fork/prune.sh 移除。
name: Fork · CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check unused files and dependencies
        run: pnpm run knip:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: apps/web
            playwright: apps/web/node_modules/playwright/cli.js
          - package: apps/server
            playwright: apps/server/node_modules/playwright-core/cli.js
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: node ${{ matrix.playwright }} install --with-deps --only-shell chromium

      - name: Test
        working-directory: ${{ matrix.package }}
        run: pnpm run test
